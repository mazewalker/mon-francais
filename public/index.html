<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mon Français – francia gyakorló</title>
<meta name="theme-color" content="#fbf7f0">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf7f0;--card:#fff;--ink:#1c2140;--muted:#6a6f8c;--line:#ebe4d8;--blue:#2f4fd8;--blue-soft:#e8edff;--red:#e5484d;--red-soft:#fdeaea;--green:#16935f;--green-soft:#e3f6ec;--amber:#b87300;--amber-soft:#fff3dc;--r:18px;--shadow:0 1px 2px rgba(28,33,64,.06),0 6px 20px rgba(28,33,64,.06)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,sans-serif;font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--blue)}
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:10px;font-family:Fraunces,serif;font-weight:800;font-size:22px;text-decoration:none;color:var(--ink)}
.flag{display:inline-flex;width:26px;height:18px;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.flag i{flex:1}.flag i:nth-child(1){background:#2f4fd8}.flag i:nth-child(2){background:#fff}.flag i:nth-child(3){background:#e5484d}
.spacer{flex:1}
.iconbtn{border:0;background:var(--card);box-shadow:var(--shadow);width:42px;height:42px;border-radius:12px;cursor:pointer;font-size:19px;display:inline-grid;place-items:center;text-decoration:none;color:var(--ink)}
.sync{font-size:15px;color:var(--muted)}
h1,h2,h3{font-family:Fraunces,serif;line-height:1.15;margin:0 0 8px}
h1{font-size:30px}h2{font-size:21px}h3{font-size:18px}
.muted{color:var(--muted)}.small{font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:18px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.grid{grid-template-columns:repeat(3,1fr)}}
.grid2{display:grid;grid-template-columns:1fr;gap:12px;margin-top:12px}
@media(min-width:620px){.grid2{grid-template-columns:1fr 1fr}}
.tbox{background:#fbf8f2;border-radius:14px;padding:10px 12px}
.mode{display:flex;flex-direction:column;gap:4px;padding:16px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);text-decoration:none;color:var(--ink);border:2px solid transparent;transition:transform .12s,border-color .12s;position:relative;min-height:128px}
.mode:hover{transform:translateY(-2px);border-color:var(--blue-soft)}
.mode .ic{font-size:30px}
.mode b{font-size:17px}
.mode span{font-size:13.5px;color:var(--muted)}
.badge{position:absolute;top:12px;right:12px;background:var(--red);color:#fff!important;font-size:12px!important;font-weight:800;border-radius:99px;padding:2px 8px}
.stats{display:flex;gap:10px;margin:8px 0 16px;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:10px 12px}
.stat b{display:block;font-size:22px;font-family:Fraunces,serif}
.stat span{font-size:12.5px;color:var(--muted)}
.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;background:var(--blue);color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--blue-soft);color:var(--blue)}
.btn.light{background:#f1ede5;color:var(--ink)}
.btn.red{background:var(--red)}.btn.green{background:var(--green)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:700;font-size:14px;cursor:pointer;user-select:none;-webkit-user-select:none}
.chip.on{border-color:var(--blue);background:var(--blue-soft);color:var(--blue)}
label.f{display:block;font-weight:800;font-size:14px;margin:14px 0 6px}
.t{width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;outline:none}
.t:focus{border-color:var(--blue)}
.answer{font-size:24px;padding:14px 16px;border-radius:14px;text-align:center;font-weight:700}
.answer.ok{border-color:var(--green);background:var(--green-soft)}
.answer.bad{border-color:var(--red);background:var(--red-soft)}
.answer.near{border-color:var(--amber);background:var(--amber-soft)}
.accents{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:10px 0}
.accents button{border:0;background:#f1ede5;border-radius:10px;min-width:40px;height:40px;font-size:19px;font-weight:700;cursor:pointer;touch-action:manipulation}
.accents button:active{background:var(--blue-soft)}
.prog{height:8px;background:#efe9df;border-radius:99px;overflow:hidden;margin:6px 0 14px}
.prog i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px;color:var(--muted);font-weight:800}
.prompt{text-align:center;padding:16px 6px}
.prompt .big{font-family:Fraunces,serif;font-size:32px;font-weight:800;line-height:1.15;word-break:break-word}
.prompt .note{color:var(--muted);font-size:15px;margin-top:6px}
.speak{width:96px;height:96px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:40px;cursor:pointer;box-shadow:0 8px 24px rgba(47,79,216,.35)}
.speak.sm{width:42px;height:42px;font-size:19px;box-shadow:none;flex:none}
.fb{border-radius:14px;padding:14px;margin-top:12px;text-align:center}
.fb.ok{background:var(--green-soft)}.fb.bad{background:var(--red-soft)}.fb.near{background:var(--amber-soft)}
.fb h3{margin:0 0 6px}
.diff{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:19px;margin:2px 0 8px;word-break:break-word}
.diff del{background:#ffc9c9;color:#a10f15;text-decoration:line-through}
.diff ins{background:#bdf0d3;color:#0b6b41;text-decoration:none;font-weight:800}
.flip{perspective:1200px;cursor:pointer}
.flip .inner{position:relative;min-height:250px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border-radius:var(--r);background:var(--card);box-shadow:var(--shadow);text-align:center}
.flip .back{transform:rotateY(180deg);background:#fffdf8}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:18px;font-weight:700;text-align:left;cursor:pointer}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--red);background:var(--red-soft)}
.opt kbd{display:inline-block;min-width:22px;color:var(--muted);font-size:13px;font-family:inherit}
table.conj{width:100%;border-collapse:collapse}
table.conj td{padding:5px 4px;vertical-align:middle}
table.conj td.p{width:1%;font-weight:800;color:var(--muted);text-align:right;padding-right:10px;white-space:nowrap}
table.conj input{font-size:19px;padding:9px 10px}
table.conj tr.ok input{border-color:var(--green);background:var(--green-soft)}
table.conj tr.bad input{border-color:var(--red);background:var(--red-soft)}
table.conj tr.near input{border-color:var(--amber);background:var(--amber-soft)}
table.conj tr.say{cursor:pointer}
table.conj tr.say:hover td{background:#f3eee4}
.corr{font-size:15px;color:var(--green);font-weight:800;margin-top:2px}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:13px;font-weight:800;background:var(--blue-soft);color:var(--blue);margin:2px 0}
.pill.r{background:var(--red-soft);color:var(--red)}
.pill.g{background:var(--green-soft);color:var(--green)}
.pill.a{background:var(--amber-soft);color:var(--amber)}
.tip{background:#f7f3ea;border-radius:12px;padding:10px 12px;font-size:14.5px;margin-top:12px}
.tip summary{cursor:pointer;font-weight:800}
details summary{cursor:pointer}
.words{width:100%;border-collapse:collapse;font-size:15px}
.words td,.words th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.words th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dots{display:inline-flex;gap:2px;margin-top:6px}.dots i{width:7px;height:7px;border-radius:2px;background:#e6dfd2}.dots i.f{background:var(--green)}
.drop{border:2.5px dashed #d8cfbf;border-radius:16px;padding:22px;text-align:center;cursor:pointer;background:#fffdf9}
.drop.over{border-color:var(--blue);background:var(--blue-soft)}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;box-shadow:var(--shadow);z-index:50;max-width:92vw;opacity:0;transition:opacity .2s;pointer-events:none;text-align:center}
.toast.show{opacity:1}
pre.code{background:#fff;border-radius:10px;padding:10px;overflow:auto;font-size:13px;margin:8px 0;border:1px solid var(--line)}
.listrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.switch{position:relative;width:46px;height:28px;flex:none;display:inline-block}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:#ddd5c6;border-radius:99px;transition:.2s;cursor:pointer}
.switch span:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(18px)}
.center{text-align:center}
.mt{margin-top:12px}
.hide{display:none!important}
.score{font-family:Fraunces,serif;font-size:58px;font-weight:800;line-height:1}
.ver{text-align:center;font-size:12.5px;color:var(--muted);margin-top:28px;opacity:.8}
.hintline{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:20px;letter-spacing:.06em;min-height:28px;color:var(--amber);font-weight:700}
</style>
</head>

<div class="wrap">
  <header class="top">

    <span class="sync" id="sync"></span>
    <a class="iconbtn" href="#szavak" title="Szólisták" aria-label="Szólisták">📚</a>
    <a class="iconbtn" href="#beallitasok" title="Beállítások" aria-label="Beállítások">⚙️</a>

  <main id="app"></main>
  <footer class="ver">Mon Français · v__APP_VERSION__</footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
'use strict';

const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const fmtDay=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>fmtDay(new Date());
function hash(s){let h=5381;for(const c of s)h=((h<<5)+h+c.codePointAt(0))|0;return (h>>>0).toString(36)}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=a=>a[Math.random()*a.length|0];

/* ---------- szövegkezelés ---------- */
function norm(s){return String(s||'').toLowerCase().replace(/[’‘ʼ´`]/g,"'").replace(/ | /g,' ').replace(/\s*'\s*/g,"'").replace(/\s+/g,' ').replace(/[\s.!?…,;:]+$/,'').replace(/^[\s¿¡]+/,'').trim()}
const fold=s=>s.replace(/œ/g,'oe').replace(/æ/g,'ae');
const deacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'');
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const ABBR=[[/\bqqch\b\.?/g,'quelque chose'],[/\bqch\b\.?/g,'quelque chose'],[/\bqqn\b\.?/g,"quelqu'un"],[/\bqn\b\.?/g,"quelqu'un"]];
function expandAbbr(s){for(const [r,t] of ABBR)s=s.replace(r,t);return s}
function frParts(fr){return String(fr||'').split(/\s*\|\s*|\s+\/\s+/).map(x=>x.trim()).filter(Boolean)}
function speakText(fr){return expandAbbr((frParts(fr)[0]||'').replace(/\([^)]*\)/g,' ')).replace(/[…]/g,'').replace(/\s+/g,' ').trim()}
function variants(fr){const out=new Set();for(const p of frParts(fr)){for(const v of [p,p.replace(/[()]/g,''),p.replace(/\([^)]*\)/g,' ')]){out.add(norm(v));out.add(norm(expandAbbr(v)))}}out.delete('');return [...out]}
const stripArt=s=>s.replace(/^(?:(?:le|la|les|un|une|des|du)\s+|l')/,'');
function checkWord(user,fr){
  const u=norm(user),uk=fold(u);const vs=variants(fr),ks=vs.map(fold);
  let best=vs[0]||'',bd=1e9;vs.forEach((v,i)=>{const d=lev(uk,ks[i]);if(d<bd){bd=d;best=v}});
  if(!u)return{res:'bad',reason:'bad',best};
  if(ks.includes(uk))return{res:'ok',best:u};
  const ka=ks.map(stripArt),ua=stripArt(uk);
  if(!S.settings.article&&ka.includes(ua))return{res:'ok',best};
  if(ks.some(k=>deacc(k)===deacc(uk)))return{res:'near',reason:'accent',best};
  if(ka.includes(ua))return{res:'near',reason:ua===uk?'artmiss':'artwrong',best};
  if(bd===1&&best.length>=4)return{res:'near',reason:'typo',best};
  return{res:'bad',reason:'bad',best};
}
function diffHTML(user,correct){const a=[...user],b=[...correct],n=a.length,m=b.length;const dp=Array.from({length:n+1},()=>new Int16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  let i=0,j=0,A='',B='';
  while(i<n&&j<m){if(a[i]===b[j]){A+=esc(a[i]);B+=esc(b[j]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){A+=`<del>${esc(a[i])}</del>`;i++}else{B+=`<ins>${esc(b[j])}</ins>`;j++}}
  while(i<n)A+=`<del>${esc(a[i++])}</del>`;while(j<m)B+=`<ins>${esc(b[j++])}</ins>`;return{a:A,b:B}}

function joinEr(st,e){if(/^[ao]/.test(e)){if(st.endsWith('c'))return st.slice(0,-1)+'ç'+e;if(st.endsWith('g'))return st+'e'+e}return st+e}
function erBase(s){
  const st=s.slice(0,-2);let mute=[st],fut=[s],note=/[cg]$/.test(st);
  if(DOUBLE.some(d=>s.endsWith(d))&&/e[lt]$/.test(st)){mute=[st+st.slice(-1)];fut=[mute[0]+'er'];note=true}
  else if(/(^|[^aeiouyéèêëàâîôûù])e[bcdfghjklmnpqrstvwxz]$/.test(st)){const m=st.slice(0,-2)+'è'+st.slice(-1);mute=[m];fut=[m+'er'];note=true}
  else if(/é[bcdfghjklmnpqrstvwxz]{1,2}$/.test(st)){const m=st.replace(/é([^é]*)$/,'è$1');mute=[m];fut=[s,m+'er'];note=true}

  else if(/ay$/.test(st)){const i=st.slice(0,-1)+'i';mute=[i,st];fut=[i+'er',s];note=true}

  return{pres,fut,pp:st+'é',group:'1. csoport (-er)'+(note?' · figyelj a helyesírásra!':'')};

function conjBase(s){
  let e=IRR.find(x=>x.only&&x.only.includes(s));
  if(!e){let best=null;for(const x of IRR){if(!x.only&&s.endsWith(x.s)&&(!best||x.s.length>best.s.length))best=x}e=best}
  if(e){const pre=s.slice(0,s.length-e.s.length);return{pres:e.p.split(' ').map(x=>x==='-'?null:[pre+x]),fut:[pre+e.f],pp:pre+e.pp,group:'rendhagyó ige',impers:!!e.impers,imp:e.imp!=null?pre+e.imp:null}}
  if(s.endsWith('oir'))return null;
  if(s.endsWith('er')&&s.length>2)return erBase(s);
  if(s.endsWith('ir')&&s.length>2){const st=s.slice(0,-2);return{pres:['is','is','it','issons','issez','issent'].map(x=>[st+x]),fut:[s],pp:st+'i',group:'2. csoport (-ir, nous -issons)'}}

function verbInfo(fr,hu,heur){
  let s=norm(frParts(fr)[0]||'').replace(/\([^)]*\)/g,' ').replace(/\b(qqch|qqn|qn|qch)\b\.?/g,' ').replace(/\s+/g,' ').trim();
  const m=s.match(/^(se |s')?([a-zàâäçéèêëîïôöûùüœ]+)(?: (.*))?$/);
  if(!m)return null;
  const refl=!!m[1],inf=m[2],rest=(m[3]||'').trim();
  if(!/(er|ir|re|oir)$/.test(inf))return null;
  if(!conjBase(inf))return null;
  if(heur){const hasNi=/(^|[\s,;(])\S*ni($|[\s,;)!?.])/i.test(String(hu||''));if(!hasNi&&(!refl||rest))return null}
  return{base:inf,refl,rest,display:(refl?(VOWEL.test(inf)?"s'":'se '):'')+inf+(rest?' '+rest:'')};
}

const AVOIR=['ai','as','a','avons','avez','ont'],ETREF=['suis','es','est','sommes','êtes','sont'],ALLER=['vais','vas','va','allons','allez','vont'];
const RP=['me','te','se','nous','vous','se'];
const rp=(k,next)=>([0,1,2,5].includes(k)&&VOWEL.test(next))?RP[k][0]+"'":RP[k]+' ';
function conjugate(raw){
  const vi=verbInfo(raw,'',false);if(!vi)return null;
  const b=conjBase(vi.base);if(!b)return null;
  const inf=vi.base,refl=vi.refl,rest=vi.rest?' '+vi.rest:'';
  const etre=refl||ETRE.has(inf);
  const persons=b.impers?[2]:[0,1,2,3,4,5];
  const mk=fn=>[0,1,2,3,4,5].map(k=>persons.includes(k)?fn(k):null);
  const R=(k,forms)=>forms.map(f=>(refl?rp(k,f):'')+f+rest);
  const IE=['ais','ais','ait','ions','iez','aient'],FE=['ai','as','a','ons','ez','ont'];
  const out={display:vi.display,inf,refl,etre,pp:b.pp,group:b.group,impers:!!b.impers};
  out.pres=mk(k=>R(k,b.pres[k]));
  const imSt=b.imp||b.pres[3][0].replace(/ons$/,'');
  out.imp=mk(k=>{let st=imSt;if(IE[k][0]==='i'){if(inf.endsWith('ger')&&st.endsWith('ge'))st=st.slice(0,-1);if(inf.endsWith('cer'))st=st.replace(/ç$/,'c')}return R(k,[st+IE[k]])});
  out.fs=mk(k=>R(k,b.fut.map(f=>f+FE[k])));
  out.cond=mk(k=>R(k,b.fut.map(f=>f+IE[k])));
  out.fp=mk(k=>[ALLER[k]+' '+(refl?rp(k,inf):'')+inf+rest]);
  out.pc=mk(k=>{const aux=etre?ETREF[k]:AVOIR[k];const pre=(refl?rp(k,aux):'')+aux+' ';const pp=b.pp;
    if(!etre)return[pre+pp+rest];
    const f=pp+'e',pm=pp.endsWith('s')?pp:pp+'s',pf=pp+'es';
    const list=k<3?[pp,f]:k===4?[pm,pf,pp,f]:[pm,pf];
    const disp=k<3?pp+'(e)':k===4?pp+'(e)(s)':(pp.endsWith('s')?pp+'(es)':pp+'(e)s');
    return[pre+disp+rest,...list.map(x=>pre+x+rest)]});

}

function grade(key,res){const p=S.prog[key]||{b:0,due:0,ok:0,bad:0};

function pickItems(items,n,src){const now=Date.now();const info=items.map(x=>({...x,p:S.prog[x.k]}));let sel;
  if(src==='hard')sel=info.filter(x=>x.p&&x.p.bad>0).sort((a,b)=>(b.p.bad/(b.p.ok+b.p.bad+1))-(a.p.bad/(a.p.ok+a.p.bad+1)));
  else if(src==='random')sel=shuffle(info);
  else{const due=shuffle(info.filter(x=>x.p&&x.p.due<=now)).sort((a,b)=>a.p.b-b.p.b);const fresh=info.filter(x=>!x.p);const later=shuffle(info.filter(x=>x.p&&x.p.due>now)).sort((a,b)=>a.p.due-b.p.due);sel=[...due,...fresh,...later]}
  return shuffle(sel.slice(0,n)).map(({p,...x})=>x)}

function rSetup(mode){const M=MODES[mode],st=S.settings,words=activeWords();

  <p class="small muted mt">${words.length} szó az aktív listákban · ${dueCount(M.skill,words)} esedékes ismétlés. Az „Okos” mód azt hozza, amit épp ideje ismételni, plusz új szavakat. A hibás szavak a kör során újra előjönnek.</p>

function speechWarn(mode){if(mode!=='diktalas')return'';loadVoices();if(frVoice||ttsCap)return'';return`<div class="fb near small">⚠️ Nem találtam francia hangot ezen a böngészőn. Ha nem hallasz semmit, próbáld Chrome-ban (Android, Windows) vagy Safariban (iPhone), illetve telepíts francia hangot a rendszerbeállításokban.</div>`}
ACT.start=a=>{const mode=a.dataset.mode,M=MODES[mode];const items=activeWords().map(w=>({w,k:'w|'+w.id+'|'+M.skill}));const sel=pickItems(items,S.settings.size,S.settings.src);
  if(!sel.length){toast(S.settings.src==='hard'?'Még nincsenek nehéz szavak – előbb gyakorolj egy kicsit!':'Nincs szó a kiválasztott listákban.');return}startSession(mode,sel)};
function startSession(mode,sel){SES={mode,queue:sel.map(x=>({...x,rep:0})),pos:0,right:0,wrong:0,first:{},mistakes:new Map(),answered:false};unlockSpeech();window.scrollTo(0,0);renderItem()}
const cur=()=>SES.queue[SES.pos];
function qHead(){const s=SES;return`<div class="qhead"><span>${s.pos+1} / ${s.queue.length}</span><span>✅ ${s.right} &nbsp; ❌ ${s.wrong}</span><button class="btn sm light" data-act="quit">Kilépés</button></div><div class="prog"><i style="width:${Math.round(s.pos/s.queue.length*100)}%"></i></div>`}
function renderItem(){if(SES.pos>=SES.queue.length)return rFinish();({kartyak:rCard,kviz:rQuiz,diktalas:rDict,iras:rWrite,ragozas:rConj})[SES.mode]()}
function answer(res){const s=SES,it=cur();if(s.answered)return;s.answered=true;grade(it.k,res);if(!(it.k in s.first))s.first[it.k]=res==='ok';
  if(res==='ok')s.right++;else{s.wrong++;s.mistakes.set(it.k,it);if(it.rep<2)s.queue.splice(Math.min(s.queue.length,s.pos+3),0,{...it,rep:it.rep+1,opts:null,hints:0,d:null})}}
function next(){if(!SES)return;SES.pos++;SES.answered=false;speechStop();renderItem()}
ACT.next=()=>next();
ACT.quit=()=>{SES=null;route()};
const focusAns=()=>setTimeout(()=>{const el=$('#ans')||$('input.ci');el&&el.focus()},60);

  return`<div class="fb ${r.res}"><h3>${t}</h3><div class="row" style="justify-content:center"><b style="font-size:22px">${esc(w.fr)}</b><button class="speak sm" data-act="say">🔊</button></div><div class="muted">${esc(w.hu)}${w.note?' · '+esc(w.note):''}</div>${diff}<button class="btn block mt" data-act="next" id="nextBtn">Tovább ⏎</button></div>`}

function finishCheck(val,r){const it=cur();let res=r.res;if(SES.mode==='iras'&&it.hints>0&&res==='ok'){res='near';r={...r,res:'near',reason:'hinted'}}
  answer(res);const inp=$('#ans');inp.readOnly=true;inp.classList.add(res);$('#btns').classList.add('hide');$('#fb').innerHTML=fbHTML(r,val,it.w);
  if(SES.mode==='iras'||res!=='ok')say(speakText(it.w.fr));setTimeout(()=>{const b=$('#nextBtn');b&&b.focus()},30)}

/* ragozás */
function listVerbs(){const m=new Map();for(const w of activeWords()){if(!w.verb)continue;const c=conjugate(w.fr);if(c&&!m.has(c.display))m.set(c.display,{fr:c.display,src:w.fr,hu:w.hu})}return[...m.values()]}

function rConjSetup(){const st=S.settings,lv=listVerbs();
  app.innerHTML=`${back}<h1 class="mt">🔁 Ragozás</h1><p class="muted">Töltsd ki az ige összes alakját (az alanyt nem kell beírni). A hibás feladatokat a kör során újra megkapod.</p>

   ${lv.length?`<p class="small muted">${lv.slice(0,40).map(v=>esc(v.fr)).join(', ')}${lv.length>40?'…':''}</p>`:'<p class="small muted">Az aktív listáidban még nincs ige. A CSV-ben jelöld „ige” típussal, vagy a Szólisták oldalon kapcsold be.</p>'}
   <label class="f">Igeidők</label><div class="chips">${TENSES.map(([k,n,h])=>`<span class="chip ${st.tenses.includes(k)?'on':''}" data-act="tog" data-key="tenses" data-val="${k}">${n} <span class="small">· ${h}</span></span>`).join('')}</div>
   <label class="f">Hány feladat?</label>${chipGroup('csize',[5,8,12,20],st.csize)}
   <label class="f">Melyik igék?</label>${chipGroup('src',SRC,st.src)}
   <button class="btn block mt" data-act="startc">Indulás ▶</button></div>
  <div class="card"><h2>📖 Ragozó szótár</h2><p class="small muted">Írj be egy igét, és megmutatom minden igeidőben.</p><div class="row"><input id="lk" class="t" style="flex:1;min-width:160px" ${INP} placeholder="pl. prendre, se lever, finir"><button class="btn" data-act="lookup">Mutasd</button></div>${accentBar()}<div id="lkout"></div></div>`}
ACT.startc=()=>{const ts=S.settings.tenses;if(!ts.length){toast('Válassz legalább egy igeidőt!');return}const verbs=conjVerbs();if(!verbs.length){toast('Válassz igéket (saját lista vagy gyakori igék)!');return}
  const items=[];for(const v of verbs)for(const t of TENSES.map(x=>x[0]).filter(x=>ts.includes(x)))items.push({k:'c|'+v.fr+'|'+t,v,tense:t});
  const sel=pickItems(items,S.settings.csize||8,S.settings.src);if(!sel.length){toast('Még nincsenek nehéz igék – előbb gyakorolj egy kicsit!');return}startSession('ragozas',sel)};
function rConj(){const it=cur();it.c=it.c||conjugate(it.v.src);const c=it.c,T=TN[it.tense],forms=c[it.tense];
  const rows=forms.map((f,k)=>f?`<tr data-k="${k}"><td class="p">${esc(subj(k,f[0],c.impers))}</td><td><input class="t ci" ${INP}><div class="corr"></div></td><td style="width:1%"><button class="speak sm hide" data-act="sayk" data-k="${k}">🔊</button></td></tr>`:'').join('');
  app.innerHTML=`${qHead()}<div class="card"><div class="center"><div class="prompt" style="padding:4px 0 10px"><div class="big">${esc(c.display)}</div><div class="note">${esc(it.v.hu)}</div></div><span class="pill">${T[1]}</span> <span class="pill a">${T[2]}</span> <span class="pill g">${esc(c.group)}</span></div>
  <details class="tip"><summary>💡 Szabály</summary><div class="mt">${TIPS[it.tense]}</div></details>
  <table class="conj mt">${rows}</table>${accentBar()}<button class="btn block" id="checkc" data-act="checkc">Ellenőrzés</button><div id="fb"></div></div>`;
  focusAns()}
const SUBJRE=/^(je |j'|tu |il |elle |on |nous |vous |ils |elles )/;
function checkForm(user,alts){const u=norm(user);if(!u)return'bad';const keys=alts.map(a=>fold(norm(a)));const cands=[u,u.replace(SUBJRE,'')].map(fold);
  if(cands.some(x=>keys.includes(x)))return'ok';if(cands.some(x=>keys.some(k=>deacc(k)===deacc(x))))return'near';return'bad'}

  $$('table.conj tr[data-k]').forEach(tr=>{const k=+tr.dataset.k,inp=tr.querySelector('input');const r=checkForm(inp.value,forms[k]);tr.className=r;inp.readOnly=true;

  $('#fb').innerHTML=`<div class="fb ${worst}"><h3>${worst==='ok'?pick(OKMSG):worst==='near'?'Majdnem! Figyelj az ékezetekre. 🧐':'Nézd meg a javításokat, és mondd ki hangosan!'}</h3><button class="btn block" data-act="next" id="nextBtn">Tovább ⏎</button></div>`;setTimeout(()=>$('#nextBtn').focus(),30)};

  <div class="grid2">${TENSES.map(([k,n,h])=>`<div class="tbox"><b>${n}</b> <span class="small muted">· ${h}</span><table class="conj">${c[k].map((f,i)=>f?`<tr class="say" data-act="sayw" data-t="${esc(fullSpeak(i,f[0],c.impers))}"><td class="p">${esc(subj(i,f[0],c.impers))}</td><td>${esc(f[0])}${f.length>1&&!c.etre||(k!=='pc'&&f.length>1)?` <span class="small muted">(${esc(f[1])})</span>`:''}</td></tr>`:'').join('')}</table></div>`).join('')}</div>

/* eredmény */
function rFinish(){const s=SES;const keys=Object.keys(s.first),good=keys.filter(k=>s.first[k]).length,pct=keys.length?Math.round(good/keys.length*100):0;const mist=[...s.mistakes.values()];
  const em=pct>=90?'🏆':pct>=70?'🌟':pct>=50?'💪':'📚';
  const msg=pct>=90?'Fantastique ! Szuper munka!':pct>=70?'Très bien ! Így tovább!':pct>=50?'Pas mal ! A hibákat érdemes még egyszer átnézni.':'Courage ! A gyakorlás teszi a mestert.';

const TEMPLATE='francia;magyar;tipus;megjegyzes;lecke\nla maison;a ház;főnév;nőnem;1. lecke\nle livre;a könyv;főnév;;1. lecke\nmanger;enni;ige;nous mangeons;1. lecke\nse lever;felkelni;ige;visszaható;1. lecke\navoir faim;éhesnek lenni;ige;kifejezés;2. lecke\nle vélo | la bicyclette;a bicikli;főnév;;2. lecke\nComment ça va ?;Hogy vagy?;kifejezés;;2. lecke\n';
function parseCSV(text){text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');const lines=text.split('\n').filter(l=>l.trim());if(!lines.length)return[];
  const head=lines.slice(0,6);let d=[';','\t',','].find(c=>head.every(l=>l.includes(c)))||[';','\t',','].find(c=>head.some(l=>l.includes(c)));
  if(!d)return lines.map(l=>{const m=l.split(/\s+[-–—=:]\s+/);return m.length>1?[m[0],m.slice(1).join(' – ')]:[l]});
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&!f.trim())q=true;else if(c===d){row.push(f);f=''}else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}else f+=c}
  row.push(f);rows.push(row);return rows.map(r=>r.map(x=>x.trim())).filter(r=>r.some(x=>x))}
const HDR={fr:['francia','french','fr','francais','mot','mots','szo','szavak','word','kifejezes','expression','vocabulaire'],hu:['magyar','hungarian','hu','hongrois','jelentes','meaning','forditas','traduction'],type:['tipus','type','szofaj','fajta','nature','categorie','kategoria'],note:['megjegyzes','note','notes','pelda','example','exemple','remarque','info','peldamondat'],lesson:['lecke','lesson','tema','fejezet','unite','chapitre','lista','temakor']};
const TYPERE=/^(ige|verb|verbe|v|fonev|nom|n|mellekne?v|adj|adjectif|hatarozoszo|hsz|adv|adverbe|kifejezes|kif|expression|eloljaro|elolj|preposition|prep|nevmas|pronom|szam|kotoszo)\.?$/;
function mapRows(rows){if(!rows.length)return[];const h=rows[0].map(x=>deacc(x.toLowerCase()).replace(/[^a-z]/g,''));const found={};h.forEach((x,i)=>{for(const k in HDR)if(found[k]==null&&HDR[k].includes(x))found[k]=i});
  let idx,hasH=false;
  if(found.fr!=null||found.hu!=null){hasH=true;idx={fr:found.fr??(found.hu===0?1:0),hu:found.hu??(found.fr===1?0:1),type:found.type??-1,note:found.note??-1,lesson:found.lesson??-1}}
  else{const c2=rows.map(r=>r[2]).filter(Boolean);const looksType=c2.length&&c2.filter(x=>TYPERE.test(deacc(x.toLowerCase()).replace(/\s/g,''))).length>=c2.length*.6;idx=looksType?{fr:0,hu:1,type:2,note:3,lesson:-1}:{fr:0,hu:1,type:-1,note:2,lesson:-1}}
  const g=(r,i)=>i>=0?(r[i]||''):'';
  return rows.slice(hasH?1:0).map(r=>({fr:g(r,idx.fr),hu:g(r,idx.hu),type:g(r,idx.type),note:g(r,idx.note),lesson:g(r,idx.lesson)})).filter(x=>x.fr&&x.hu)}
async function readFile(file){const buf=await file.arrayBuffer();let text,warn='';try{text=new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch(e){try{text=new TextDecoder('windows-1250').decode(buf)}catch(e2){text=new TextDecoder('iso-8859-1').decode(buf)}warn='A fájl nem UTF-8 kódolású (valószínűleg Excelből mentve). Ha hibás betűket látsz (pl. è, à, ê, œ helyett ?), mentsd újra „CSV UTF-8” formátumban, vagy használd a Google Táblázatot.'}
  if(/[a-zà-ÿ]\?[a-zà-ÿ]/i.test(text)&&!warn)warn='Néhány szóban kérdőjel van betű helyett – lehet, hogy elveszett egy ékezetes betű a mentéskor.';return{text,warn}}
function buildImport(text,name,warn){let rows=mapRows(parseCSV(text));if(!rows.length){toast('Nem találtam szavakat. Két oszlop kell: francia és magyar.');return}
  const huLike=r=>/^(a|az|egy) /i.test(r.fr)||/[őű]/i.test(r.fr),frLike=r=>/^(le |la |les |l'|un |une |des )/i.test(r.hu)||/[èêçœàù]/i.test(r.hu);
  const sc=rows.filter(r=>huLike(r)&&!huLike({fr:r.hu})).length+rows.filter(frLike).length;let autoswap=false;
  if(sc>rows.length*.5){rows=rows.map(r=>({...r,fr:r.hu,hu:r.fr}));autoswap=true}
  const lessons=[...new Set(rows.map(r=>r.lesson).filter(Boolean))];IMP={rows,name,warn,autoswap,lessons};rLists();setTimeout(()=>{const el=$('#imp');el&&el.scrollIntoView({behavior:'smooth',block:'start'})},50)}
async function handleFile(file){try{const {text,warn}=await readFile(file);buildImport(text,file.name.replace(/\.[^.]+$/,''),warn)}catch(e){toast('Nem sikerült beolvasni a fájlt.')}}

  const v=$('#voice');if(v)v.onchange=()=>{S.settings.voice=v.value;save();loadVoices();say('Bonjour !')};
  const r=$('#rate');r.oninput=()=>{$('#ratev').textContent=r.value};r.onchange=()=>{S.settings.rate=+r.value;save()};loadInvites()}
/* meghívók */
let INV=null;
const invLink=c=>location.origin+'/register?invite='+encodeURIComponent(c);
const fmtDate=t=>t?fmtDay(new Date(t)).replace(/-/g,'.')+'.':'';
function invHTML(){const I=INV;if(I.error)return`<p class="small muted">${esc(I.error)}</p>`;if(!I.limit&&!I.invites.length)return'<p class="small muted">Meghívót most csak az adminisztrátor tud készíteni.</p>';
  const st=i=>i.status==='used'?`<span class="pill g">✔ regisztrált: ${esc(i.usedBy)}</span>`:i.status==='open'?`<span class="pill">érvényes: ${esc(fmtDate(i.expiresAt))}-ig</span>`:'<span class="pill r">lejárt</span>';
  const row=i=>`<div class="listrow"><div style="flex:1;min-width:160px"><b>${esc(i.note||'Meghívó')}</b> <span class="small muted">· ${esc(i.code)}</span><div>${st(i)}</div></div>
   ${i.status==='open'?`<button class="btn sm ghost" data-act="invcopy" data-c="${esc(i.code)}">${navigator.share?'📤 Küldés':'📋 Link másolása'}</button>${CONFIRM==='inv:'+i.code?`<button class="btn sm red" data-act="invrevoke" data-c="${esc(i.code)}">Biztos törlöd?</button><button class="btn sm light" data-act="invcancel">Mégse</button>`:`<button class="btn sm light" data-act="invask" data-c="${esc(i.code)}" aria-label="Meghívó törlése">🗑️</button>`}`:''}</div>`;
  return`<p class="small">Legfeljebb <b>${I.limit}</b> embert hívhatsz meg. Még <b>${I.remaining}</b> meghívód maradt.</p>
  <p class="small muted">A link 14 napig érvényes, és csak egyszer használható. A lejárt vagy törölt (fel nem használt) meghívó nem számít bele a keretbe.</p>
  ${I.invites.map(row).join('')}
  ${I.remaining>0?`<div class="row mt"><input id="invnote" class="t" style="flex:1;min-width:160px" maxlength="60" placeholder="Kinek szól? (pl. Anna)"><button class="btn sm" data-act="invnew">+ Új meghívó</button></div>`:'<p class="small muted mt">Elfogyott a meghívó-kereted.</p>'}`}
function showInv(d){INV=d;const b=$('#invbox');if(b)b.innerHTML=invHTML()}
async function invApi(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{cache:'no-store'});
  if(r.status===401){toLogin();throw 0}const d=await r.json().catch(()=>({}));if(!r.ok)throw d.error||'error';return d}
async function loadInvites(){try{showInv(await invApi('/api/invites'))}catch(e){if(!INV)showInv({error:'A meghívók most nem érhetők el.'})}}
async function shareInvite(code,note){const url=invLink(code);
  if(navigator.share){try{await navigator.share({title:'Mon Français',text:`Meghívó a Mon Français francia gyakorlóba${note?' – '+note:''}:`,url});return}catch(e){if(e&&e.name==='AbortError')return}}
  copyText(url,'Meghívó link kimásolva – küldd el annak, akit meghívsz!')}
ACT.invnew=async a=>{a.disabled=true;const note=($('#invnote')||{}).value||'';
  try{const d=await invApi('/api/invites',{note});showInv(d);const i=d.invites[d.invites.length-1];if(i)shareInvite(i.code,i.note)}
  catch(e){toast(e==='invite_limit'?'Elfogyott a meghívó-kereted.':'Nem sikerült meghívót készíteni.');loadInvites()}};
ACT.invcopy=a=>{const i=INV.invites.find(x=>x.code===a.dataset.c);i&&shareInvite(i.code,i.note)};
ACT.invask=a=>{CONFIRM='inv:'+a.dataset.c;showInv(INV)};
ACT.invcancel=()=>{CONFIRM=null;showInv(INV)};
ACT.invrevoke=async a=>{CONFIRM=null;try{showInv(await invApi('/api/invites/revoke',{code:a.dataset.c}));toast('Meghívó törölve.')}catch(e){toast('Ezt a meghívót már nem lehet törölni.');loadInvites()}};
ACT.testvoice=()=>{S.settings.rate=+$('#rate').value;say('Bonjour ! Comment ça va ? Je m\'appelle Claude.')};
ACT.copybak=()=>copyText(JSON.stringify(S),'Mentés kimásolva – tedd el egy jegyzetbe.');
ACT.dlbak=()=>{const u=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));const a=document.createElement('a');a.href=u;a.download='mon-francais-mentes-'+today()+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1000)};
ACT.loadbak=()=>{try{const o=JSON.parse($('#bak').value);if(!o||!Array.isArray(o.lists))throw 0;S=migrate(o);save();toast('Mentés visszatöltve!');location.hash=''}catch(e){toast('Ez nem érvényes mentés.')}};
ACT.askreset=()=>{CONFIRM='reset';rSettings()};
ACT.logout=async()=>{try{if(cloud.ready){clearTimeout(cloud.t);await putState()}}catch(e){}try{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})}catch(e){}toLogin()};
ACT.resetall=()=>{S.prog={};S.stats={days:{}};CONFIRM=null;save();rSettings();toast('Haladás nullázva.')};

/* ---------- szerver-mentés ---------- */
const cloud={ready:false,writing:false,pending:false,t:0};
function setSync(s){const el=$('#sync');if(!el)return;el.textContent=s==='ok'?'☁️':s==='err'?'⚠️':'';el.title=s==='ok'?'Mentve a szerverre':s==='err'?'A szerver-mentés nem sikerült (a helyi mentés megvan, később újrapróbálom)':''}
async function putState(keepalive){const r=await fetch('/api/state',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({json:JSON.stringify(S),updatedAt:S.updatedAt}),keepalive:!!keepalive});
  if(r.status===401){toLogin();return}if(r.status===409){const d=await r.json();adopt(d);return}if(!r.ok)throw new Error('HTTP '+r.status)}
function adopt(d){try{S=migrate(JSON.parse(d.json));S.updatedAt=d.updatedAt;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(!SES)route()}catch(e){}}
function pushCloud(){if(!cloud.ready)return;clearTimeout(cloud.t);cloud.t=setTimeout(async()=>{if(cloud.writing){cloud.pending=true;return}cloud.writing=true;
  try{await putState();setSync('ok')}catch(e){setSync('err');cloud.retry=true}
  cloud.writing=false;if(cloud.pending){cloud.pending=false;pushCloud()}},1500)}
async function initCloud(){
  try{const r=await fetch('/api/state',{cache:'no-store'});if(r.status===401){toLogin();return}if(!r.ok&&r.status!==204)throw new Error('HTTP '+r.status);
    const d=r.status===204?null:await r.json();
    if(d&&typeof d.json==='string'&&(d.updatedAt||0)>(S.updatedAt||0))adopt(d);
    cloud.ready=true;setSync('ok');if(!d||(d.updatedAt||0)<(S.updatedAt||0))pushCloud()}
  catch(e){setSync('err');setTimeout(initCloud,15000)}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&cloud.ready&&cloud.t){clearTimeout(cloud.t);cloud.t=0;putState(true).catch(()=>{})}});
window.addEventListener('online',()=>{if(cloud.ready)pushCloud();else initCloud()});
setInterval(()=>{if(cloud.retry&&cloud.ready){cloud.retry=false;pushCloud()}},30000);

/* ---------- indulás ---------- */
let S=load();
loadBaseCached();
if('speechSynthesis' in window){loadVoices();try{speechSynthesis.onvoiceschanged=loadVoices}catch(e){}}
route();
setTimeout(()=>{initCloud();fetchBase()},0);
</script>
</body>
</html>
